name: Images et validation du blog Markdown
on:
  pull_request:
    paths:
      - 'contenus/blog/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/images-blog.yml'
permissions:
  contents: read
concurrency:
  group: images-blog-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Préparer les images des articles importés
        run: node scripts/prepare-blog-build-images.mjs
      - name: Tester les conversions et la publication
        run: node --test tests/prepareBlogBuildImages.test.js tests/buildArticles.test.js tests/blog.test.js tests/publishBlog.test.js tests/technicalSeoRoutes.test.js
      - name: Build de prévisualisation sans écriture dans GitHub
        run: npm run build
        env:
          CF_PAGES: '1'
          CF_PAGES_BRANCH: ${{ github.head_ref }}
