<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page introuvable | Efficia Digital</title>
  <meta name="description" content="La page demandée n’existe pas ou n’est plus disponible." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/assets/favicon/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/header.css">
  <style>
    .not-found {
      min-height: calc(100vh - 76px);
      display: grid;
      place-items: center;
      text-align: center;
    }

    .not-found h1 {
      margin-top: 12px;
      color: var(--navy);
      font-size: clamp(38px, 6vw, 64px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .not-found p {
      margin: 20px auto 30px;
    }

    .not-found__actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 20px;
      align-items: center;
    }

    .not-found__link {
      color: var(--navy);
      font-weight: 600;
      text-underline-offset: 4px;
    }

    .not-found__link:hover,
    .not-found__link:focus-visible {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="brand" aria-label="Efficia Digital">
        <img src="/assets/logo/logo-efficia-web.png" alt="Efficia Digital">
      </a>
    </div>
  </header>

  <main>
    <section class="section not-found">
      <div class="container">
        <div class="section-heading center wide">
          <span class="section-kicker">Erreur 404</span>
          <h1>Cette page n’existe pas.</h1>
          <p>La page demandée a peut-être été déplacée ou son adresse est incorrecte.</p>
          <div class="not-found__actions">
            <a href="/" class="btn btn-primary">Retour à l’accueil</a>
            <a href="/#diagnostic" class="not-found__link">Faire le diagnostic gratuit</a>
            <a href="/#offres" class="not-found__link">Découvrir les offres</a>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
